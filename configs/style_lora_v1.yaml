model_path: /data/PersonalCoder/model
train_dataset: data/processed/style_chunks/train.jsonl
validation_dataset: data/processed/style_chunks/validation.jsonl
output_dir: /data/PersonalCoder/checkpoints/style_lora_v1
local_files_only: true
quantization:
  load_in_4bit: true
  quantization_type: nf4
  compute_dtype: float16
  double_quant: true
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - v_proj
max_seq_length: 512
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
optimizer: paged_adamw_8bit
learning_rate: 0.0002
warmup_ratio: 0.03
lr_scheduler_type: cosine
num_train_epochs: 1
fp16: true
logging_steps: 10
eval_strategy: steps
eval_steps: 100
save_strategy: steps
save_steps: 100
save_total_limit: 2
seed: 42
